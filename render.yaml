services:
  - type: web
    name: fell-concierge
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PORTAL_LINK_SECRET
        generateValue: true
      - key: PORTAL_LINK_TTL_DAYS
        value: 30
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_ROOT
        value: /var/data/fell-concierge
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: hello@fell-co.com
      - key: RESEND_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
    disk:
      name: fell-concierge-storage
      mountPath: /var/data/fell-concierge
      sizeGB: 1
